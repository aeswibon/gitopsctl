name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Go fmt (check)
        run: |
          test -z "$(gofmt -l .)"

      - name: Go test
        run: |
          go test ./...

      - name: Go vet
        run: |
          go vet ./...

      - name: CLI smoke
        run: |
          chmod +x scripts/cli-smoke.sh
          scripts/cli-smoke.sh

